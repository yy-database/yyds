name: Check Python

# Python extension and client checks. Rust fmt/test: check-rust.yml
# TypeScript checks: check-typescript.yml
on:
  push:
    branches: [dev]
    paths:
      - "projects/yyds.py/**"
      - "projects/yyds.rs/yyds-pyo3/**"
      - "projects/yyds.rs/yyds-napi/**"
      - "projects/yyds.rs/Cargo.toml"
      - "projects/yyds.ts/packages/yyds/**"
      - "projects/yyds.ts/packages/yyds-harness/**"
      - "projects/yyds.py/packages/yyds/tests/clients/**"
      - ".github/workflows/check-python.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [dev]
    paths:
      - "projects/yyds.py/**"
      - "projects/yyds.rs/yyds-pyo3/**"
      - "projects/yyds.rs/yyds-napi/**"
      - "projects/yyds.rs/Cargo.toml"
      - "projects/yyds.ts/packages/yyds/**"
      - "projects/yyds.ts/packages/yyds-harness/**"
      - "projects/yyds.py/packages/yyds/tests/clients/**"
      - ".github/workflows/check-python.yml"
      - "package.json"
      - "pnpm-workspace.yaml"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly

jobs:
  python:
    name: yyds-pyo3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yyds.rs
      - name: Install maturin
        run: python -m pip install --upgrade maturin
      - name: Check formatting
        working-directory: projects/yyds.rs
        run: cargo fmt -p yyds-pyo3 -- --check
      - name: Cargo check
        working-directory: projects/yyds.rs
        run: cargo check -p yyds-pyo3
      - name: Cargo test
        working-directory: projects/yyds.rs
        run: cargo test -p yyds-pyo3
      - name: Build wheel
        working-directory: projects/yyds.py/packages/yyds
        run: maturin build --release --out ../../../../dist
      - name: Install wheel in a clean venv
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/python ]; then VENV_PY=.venv/bin/python; else VENV_PY=.venv/Scripts/python.exe; fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install dist/*.whl
          echo "VENV_PY=$VENV_PY" >> "$GITHUB_ENV"
      - name: Run unittest suite
        shell: bash
        run: '"$VENV_PY" -m unittest discover -s projects/yyds.py/packages/yyds/tests -v'
      - name: Smoke test the example
        shell: bash
        run: '"$VENV_PY" projects/yyds.py/packages/yyds/examples/local-node/main.py'

  # Real PostgreSQL and MySQL drivers against a node started by `yyds start`.
  # The harness publishes its own catalog and picks dynamic ports, so no
  # external database service is involved.
  sql-clients:
    name: SQL real clients (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yyds.rs
      - run: pnpm install
      - name: Build native bindings
        run: pnpm build:napi
      - name: Build the TypeScript CLI
        run: pnpm build:ts
      - name: Install SQL client drivers
        run: python -m pip install psycopg2-binary psycopg pymysql mysql-connector-python redis pymongo
      - name: Run the end-to-end SQL smoke
        run: node projects/yyds.ts/packages/yyds-harness/run.mjs
      - name: Run the SQL real-client matrix
        run: python projects/yyds.py/packages/yyds/tests/clients/run_all.py
      - name: Run the binary payload cases
        run: python projects/yyds.py/packages/yyds/tests/clients/run_all.py --suite payloads
      - name: Run the Redis real-client suite
        run: python projects/yyds.py/packages/yyds/tests/clients/run_all.py --suite redis
      - name: Run the MongoDB real-client suite
        run: python projects/yyds.py/packages/yyds/tests/clients/run_all.py --suite mongo
      - name: Gate on the Redis and MongoDB case counts
        run: node scripts/assert-test-count.mjs redis-py mongo-py

  # Redis and MongoDB engine parity. The emulated gateway runs in the same job as a
  # real `redis:7` and `mongo:7` service container, and every probe runs twice: once
  # against the container and once against the node under test. `--require-oracle`
  # fails the job when a probe has no real engine to compare against, so a service
  # container that fails to start can never be mistaken for a passing parity run.
  nosql-oracle:
    name: Redis and MongoDB engine parity (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yyds.rs
      - run: pnpm install
      - name: Build native bindings
        run: pnpm build:napi
      - name: Build the TypeScript CLI
        run: pnpm build:ts
      - name: Install the Redis and MongoDB drivers
        run: python -m pip install redis pymongo
      - name: Compare the gateways against real engines
        env:
          YYDS_ORACLE_REDIS_URL: redis://127.0.0.1:6379/0
          YYDS_ORACLE_MONGO_URL: mongodb://127.0.0.1:27017
        run: python projects/yyds.py/packages/yyds/tests/clients/run_all.py --suite oracle-nosql --require-oracle
