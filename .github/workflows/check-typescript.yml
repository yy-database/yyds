name: Check TypeScript

# pnpm package build/test. Rust checks: check-rust.yml
# Publish: release-npm.yml on v*.*.* tags.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm build:napi
      - run: pnpm test:ts
      - run: pnpm --filter @yydb/yyds-webui check
      - run: pnpm --filter @yydb/yyds-homepage check
      - run: pnpm --filter @yydb/yyds build
      - run: pnpm --filter @yydb/yyds-homepage build
