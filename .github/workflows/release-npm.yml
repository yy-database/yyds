name: Release

# Independent of CI (check/test). Trigger only by pushing a semver tag:
#   git tag v0.0.2 && git push origin v0.0.2
# Publishes @yydb/* via npm OIDC (platform .node packages included).
# Already-published npm versions are skipped (retry-safe).
# Trusted Publisher workflow filename must stay: release-npm.yml
# Release setup: AGENTS.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override semver (defaults to tag version or package.json)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # required for publish-npm OIDC (job-level permissions also set)

env:
  CARGO_TERM_COLOR: always

jobs:
  check-python:
    name: Python binding gate
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    defaults:
      run:
        working-directory: projects/yyds.py/packages/yyds
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yyds.rs
      - name: Install maturin
        run: python -m pip install --upgrade maturin
      - name: Check formatting
        working-directory: projects/yyds.rs
        run: cargo fmt -p yyds-pyo3 -- --check
      - name: Cargo check
        working-directory: projects/yyds.rs
        run: cargo check -p yyds-pyo3
      - name: Cargo test
        working-directory: projects/yyds.rs
        run: cargo test -p yyds-pyo3
      - name: Build wheel
        working-directory: projects/yyds.rs
        run: maturin build --release --out ../../../../dist
      - name: Install wheel in clean venv + import + unittest + example
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          VENV_PY=.venv/bin/python
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install dist/*.whl
          "$VENV_PY" -c "import yyds; print('yyds import ok')"
          "$VENV_PY" -m unittest discover -s projects/yyds.py/packages/yyds/tests -v
          "$VENV_PY" projects/yyds.py/packages/yyds/examples/local-node/main.py

  build-engine:
    name: engine ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: yyds-win32-x64
            node_file: index.win32-x64-msvc.node
            lib: yyds_napi.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: yyds-linux-x64
            node_file: index.linux-x64-gnu.node
            lib: libyyds_napi.so
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - name: Install compilation target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yyds.rs
          key: ${{ matrix.target }}
      - name: Build yyds-napi
        run: cargo build --manifest-path projects/yyds.rs/Cargo.toml -p yyds-napi --release --target ${{ matrix.target }}
      - name: Stage native binding
        shell: bash
        run: |
          set -euo pipefail
          SRC="projects/yyds.rs/target/${{ matrix.target }}/release/${{ matrix.lib }}"
          DEST="projects/yyds.ts/platforms/${{ matrix.pkg }}/lib/${{ matrix.node_file }}"
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          chmod +x "$DEST" || true
          ls -la "$DEST"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.pkg }}
          path: projects/yyds.ts/platforms/${{ matrix.pkg }}/lib/${{ matrix.node_file }}
          if-no-files-found: error

  build-engine-macos:
    name: engine macos arm64 + x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
      - name: Install both macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/yyds.rs
          key: macos-latest-both
      - name: Build and stage both dylibs
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
              "aarch64-apple-darwin  yyds-darwin-arm64  index.darwin-arm64.node  libyyds_napi.dylib" \
              "x86_64-apple-darwin    yyds-darwin-x64    index.darwin-x64.node    libyyds_napi.dylib"; do
            read -r target pkg node_file lib <<< "$spec"
            echo "=== Building $pkg ($target) ==="
            cargo build --manifest-path projects/yyds.rs/Cargo.toml -p yyds-napi --release --target "$target"
            SRC="projects/yyds.rs/target/$target/release/$lib"
            DEST="projects/yyds.ts/platforms/$pkg/lib/$node_file"
            mkdir -p "$(dirname "$DEST")"
            cp "$SRC" "$DEST"
            chmod +x "$DEST" || true
            ls -la "$DEST"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: engine-yyds-darwin-arm64
          path: projects/yyds.ts/platforms/yyds-darwin-arm64/lib/index.darwin-arm64.node
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: engine-yyds-darwin-x64
          path: projects/yyds.ts/platforms/yyds-darwin-x64/lib/index.darwin-x64.node
          if-no-files-found: error

  publish-npm:
    name: publish npm
    needs: [check-python, build-engine, build-engine-macos]
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Do not set registry-url: it writes _authToken into npmrc and blocks OIDC (npm E404 on PUT).
      - name: Ensure npm CLI supports OIDC
        run: |
          npm install -g npm@latest
          node -v
          npm -v
      - run: pnpm install --no-frozen-lockfile

      - name: Download engine artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: _engines
          merge-multiple: true

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch 可直接传 version 输入
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publishing version $version (workflow_dispatch input)"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "expected semver tag like v1.2.3, got: $tag (neither tag nor workflow_dispatch version input)" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version (tag $tag)"

      - name: Prepare packages for publish
        env:
          INPUT_VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/prepare-npm-publish.mjs

      - name: Strip token-style npmrc (OIDC only)
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in "${HOME}/.npmrc" "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc"; do
            [[ -n "${f}" && -f "${f}" ]] || continue
            if grep -q '_authToken' "${f}"; then
              grep -v '_authToken' "${f}" > "${f}.oidc" && mv "${f}.oidc" "${f}"
              echo "stripped _authToken from ${f}"
            fi
          done

      # OIDC only — do not set NODE_AUTH_TOKEN (even empty).
      - name: Publish npm
        run: node scripts/publish-npm-packages.mjs
