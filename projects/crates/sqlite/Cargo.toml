[package]
name = "yyds-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust SQLite format 3 passthrough for YYDS (not a YY-optimized store)"
publish = false
readme = "readme.md"

[lib]
path = "src/lib.rs"

[dependencies]
yyds-types = { workspace = true }
sqlite-provider = { workspace = true }
sqlite-provider-rusqlite = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
