[package]
name = "yyds-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node-API binding for the distributed YYDS database"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
yyds-types = { workspace = true }
yyds-sqlite = { workspace = true }
yyds-control = { workspace = true }
yyds-kv = { workspace = true }
yyds-catalog = { workspace = true }
yyds-gateway-redis = { path = "../yyds-gateways/yyds-gateway-redis" }
yyds-gateway-pgsql = { path = "../yyds-gateways/yyds-gateway-pgsql" }
yyds-gateway-mysql = { path = "../yyds-gateways/yyds-gateway-mysql" }
yyds-execution = { workspace = true }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha1 = "0.10"
base64 = "0.22"
napi = { workspace = true, features = ["napi6"] }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[package.metadata.napi]
name = "yyds"
