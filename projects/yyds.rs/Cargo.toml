[workspace]
resolver = "2"
members = [
    "yyds-napi",
    "yyds-pyo3",
]
default-members = ["yyds-napi"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/yy-database/yyds"

[workspace.dependencies]
# Sole database.rs dependency · the `database` facade. Pin full 40-char rev.
database = { git = "https://github.com/oovm/database.rs.git", rev = "904bee590dfc0282d4d2ad5ee31773e7f25e658b" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
napi-build = "2"
pyo3 = { version = "0.30.1", features = ["extension-module"] }

[profile.release]
lto = true
panic = "abort"
