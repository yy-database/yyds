[package]
name = "oak-sql"
version = "0.0.12"
edition = "2024"
description = "SQL database query language parser with support for standard SQL syntax and database operations."
license = "MIT"
repository = "https://github.com/yggdrasil-language/oak.rs/tree/master/examples/oak-sql"
keywords = ["parser", "sql", "database", "query"]

[dependencies]
oak-core = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "49eaa0bc07f0562c06d2a19fbf5fdd235184a3bb", package = "oak-core" }
serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = ["serde"]
serde = ["dep:serde", "oak-core/serde"]
