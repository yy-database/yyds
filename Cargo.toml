[workspace]
resolver = "2"
members = [
    "projects/crates/*",
    "projects/crates/yyds-gateways/yyds-gateway",
    "projects/crates/yyds-gateways/yyds-gateway-redis",
    "projects/crates/yyds-gateways/yyds-gateway-mysql",
    "projects/crates/yyds-gateways/yyds-gateway-pgsql",
]
exclude = ["projects/crates/yyds-gateways"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/yy-database/yyds"

[workspace.dependencies]
# Shared VOS schema contract — always the voml/vos-language `dev` branch (not a
# forked dialect). Path overrides are for local hacking only, publish and CI use git.
vos = { version = "0.1.0", git = "https://github.com/voml/vos-language.git", branch = "dev" }
yyds-types = { path = "projects/crates/yyds-types" }
yyds-kv = { path = "projects/crates/yyds-kv" }
yyds-catalog = { path = "projects/crates/yyds-catalog" }
yyds-sqlite = { path = "projects/crates/sqlite" }
yy-execution = { git = "https://github.com/yy-database/yydb.git", rev = "cce5b0f42c1df4d34599b4f0eff0f890cd00ef9b", package = "yy-execution" }
yyds-gateway = { path = "projects/crates/yyds-gateways/yyds-gateway" }
oak-sql = { git = "https://github.com/yggdrasil-language/oaks.git", branch = "dev", package = "oak-sql" }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
napi-build = "2"
wasm-bindgen = "0.2"

[profile.release]
lto = true
panic = "abort"
