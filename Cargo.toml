[workspace]
resolver = "2"
members = [
    "projects/crates/*",
    "projects/crates/yyds-gateways/yyds-gateway",
    "projects/crates/yyds-gateways/yyds-gateway-redis",
    "projects/crates/yyds-gateways/yyds-gateway-mysql",
    "projects/crates/yyds-gateways/yyds-gateway-pgsql",
]
exclude = ["projects/crates/yyds-gateways"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/yy-database/yyds"

[workspace.dependencies]
# Shared VOS schema contract. Keep the revision explicit so Oak-backed syntax
# changes are reproducible in CI and never become a forked dialect.
vos = { version = "0.1.0", git = "https://github.com/voml/vos-language.git", rev = "0eb059d9b32d49a25780ec6a8fd5962c32fee6d9" }
yyds-types = { path = "projects/crates/yyds-types" }
yyds-kv = { path = "projects/crates/yyds-kv" }
yyds-catalog = { path = "projects/crates/yyds-catalog" }
yyds-sqlite = { path = "projects/crates/sqlite" }
yyds-gateway = { path = "projects/crates/yyds-gateways/yyds-gateway" }
serde_json = "1"
oak-sql = { git = "https://github.com/yggdrasil-language/oaks.git", rev = "424dd544c57f2d9e40b248056ab12a1725ae932f", package = "oak-sql" }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem"] }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
napi-build = "2"
wasm-bindgen = "0.2"

[profile.release]
lto = true
panic = "abort"
